name: segment_and_analyze_microbial_cells
display_name: Segment And Analyze Microbial Cells
description: Perform automated cell segmentation and quantify morphological metrics
  from fluorescence microscopy images.
parameters:
  required:
  - name: image_path
    type: str
    description: Path to the fluorescence microscopy image file
  optional:
  - name: output_dir
    type: str
    description: Directory to save output files
    default: ./output
  - name: min_cell_size
    type: int
    description: Minimum cell size in pixels to filter noise
    default: 50
implementation:
  type: module_ref
  module: biomni.tool.microbiology
  function: segment_and_analyze_microbial_cells
returns:
  type: str
  description: 工具执行结果
