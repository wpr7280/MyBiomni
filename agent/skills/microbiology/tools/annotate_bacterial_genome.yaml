name: annotate_bacterial_genome
display_name: Annotate Bacterial Genome
description: Annotate a bacterial genome using Prokka to identify genes, proteins,
  and functional features.
parameters:
  required:
  - name: genome_file_path
    type: str
    description: Path to the assembled genome sequence file in FASTA format
  optional:
  - name: output_dir
    type: str
    description: Directory where annotation results will be saved
    default: annotation_results
  - name: genus
    type: str
    description: Genus name for the organism
    default: ''
  - name: species
    type: str
    description: Species name for the organism
    default: ''
  - name: strain
    type: str
    description: Strain identifier
    default: ''
  - name: prefix
    type: str
    description: Prefix for output files
    default: ''
implementation:
  type: module_ref
  module: biomni.tool.microbiology
  function: annotate_bacterial_genome
returns:
  type: str
  description: 工具执行结果
