name: create_biochemical_network_sbml_model
display_name: Create Biochemical Network Sbml Model
description: Generate a mathematical model of a biochemical network in SBML format.
parameters:
  required:
  - name: reaction_network
    type: List[dict]
    description: List of dictionaries representing reactions with id, name, reactants,
      products, and reversible properties
  - name: kinetic_parameters
    type: dict
    description: Dictionary mapping reaction IDs to kinetic law parameters with law_type
      and parameters
  optional:
  - name: output_file
    type: str
    description: File path to save the SBML model
    default: biochemical_model.xml
implementation:
  type: module_ref
  module: biomni.tool.synthetic_biology
  function: create_biochemical_network_sbml_model
returns:
  type: str
  description: 工具执行结果
