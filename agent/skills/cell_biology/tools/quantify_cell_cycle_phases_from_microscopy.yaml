name: quantify_cell_cycle_phases_from_microscopy
display_name: Quantify Cell Cycle Phases From Microscopy
description: Quantify the percentage of cells in each cell cycle phase using Calcofluor
  white stained microscopy images.
parameters:
  required:
  - name: image_paths
    type: List[str]
    description: List of file paths to microscopy images of cells stained with Calcofluor
      white
  optional:
  - name: output_dir
    type: str
    description: Directory to save results
    default: ./results
implementation:
  type: module_ref
  module: biomni.tool.cell_biology
  function: quantify_cell_cycle_phases_from_microscopy
returns:
  type: str
  description: 工具执行结果
