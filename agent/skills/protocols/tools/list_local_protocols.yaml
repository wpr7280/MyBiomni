name: list_local_protocols
display_name: List Local Protocols
description: List available protocol files in the local biomni/tool/protocols/ directory.
  Includes protocols from Addgene and Thermo Fisher Scientific.
parameters:
  optional:
  - name: source
    type: str
    description: Filter by source directory (e.g., 'addgene' or 'thermofisher'). If
      None, lists all protocols.
    default: null
implementation:
  type: module_ref
  module: biomni.tool.protocols
  function: list_local_protocols
returns:
  type: str
  description: 工具执行结果
