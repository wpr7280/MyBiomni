name: design_verification_primers
display_name: Design Verification Primers
description: Design Sanger sequencing primers to verify a specific region in a plasmid.
  First tries to use primers from an existing primer pool. If they cannot fully cover
  the region, designs additional primers as needed.
parameters:
  required:
  - name: plasmid_sequence
    type: str
    description: The complete plasmid sequence
  - name: target_region
    type: Tuple[int, int]
    description: Start and end positions to verify (0-based indexing)
  optional:
  - name: existing_primers
    type: Optional[List[Dict[str, str]]]
    description: List of existing primers with their sequences and optional names
    default: null
  - name: is_circular
    type: bool
    description: Whether the plasmid is circular
    default: true
  - name: coverage_length
    type: int
    description: Typical read length for each primer in base pairs
    default: 800
  - name: primer_length
    type: int
    description: Length of newly designed primers
    default: 20
  - name: min_gc
    type: float
    description: Minimum GC content for new primers
    default: 0.4
  - name: max_gc
    type: float
    description: Maximum GC content for new primers
    default: 0.6
  - name: min_tm
    type: float
    description: Minimum melting temperature in °C
    default: 55.0
  - name: max_tm
    type: float
    description: Maximum melting temperature in °C
    default: 65.0
implementation:
  type: module_ref
  module: biomni.tool.molecular_biology
  function: design_verification_primers
returns:
  type: str
  description: 工具执行结果
