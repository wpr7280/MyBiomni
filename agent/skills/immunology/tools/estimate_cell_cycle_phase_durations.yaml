name: estimate_cell_cycle_phase_durations
display_name: Estimate Cell Cycle Phase Durations
description: Estimate cell cycle phase durations using dual-nucleoside pulse labeling
  data and mathematical modeling.
parameters:
  required:
  - name: flow_cytometry_data
    type: dict
    description: Dictionary containing experimental data from flow cytometry with
      EdU and BrdU labeling, including time points and percentages of labeled cells
  - name: initial_estimates
    type: dict
    description: Initial estimates for cell cycle phase durations and death rates
implementation:
  type: module_ref
  module: biomni.tool.immunology
  function: estimate_cell_cycle_phase_durations
returns:
  type: str
  description: 工具执行结果
