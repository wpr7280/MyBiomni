name: analyze_cytokine_production_in_cd4_tcells
display_name: Analyze Cytokine Production In Cd4 Tcells
description: Analyze cytokine production (IFN-γ, IL-17) in CD4+ T cells after antigen
  stimulation.
parameters:
  required:
  - name: fcs_files_dict
    type: dict
    description: 'Dictionary mapping stimulation conditions to FCS file paths. Expected
      keys: ''unstimulated'', ''Mtb300'', ''CMV'', ''SEB'''
  optional:
  - name: output_dir
    type: str
    description: Directory to save the results file
    default: ./results
implementation:
  type: module_ref
  module: biomni.tool.immunology
  function: analyze_cytokine_production_in_cd4_tcells
returns:
  type: str
  description: 工具执行结果
