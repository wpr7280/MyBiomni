name: analyze_cns_lesion_histology
display_name: Analyze Cns Lesion Histology
description: Analyzes histological images of CNS lesions to quantify immune cell infiltration,
  demyelination, and tissue damage.
parameters:
  required:
  - name: image_path
    type: str
    description: Path to the microscopy image file of brain or spinal cord tissue
      section
  optional:
  - name: output_dir
    type: str
    description: Directory to save output files
    default: ./output
  - name: stain_type
    type: str
    description: 'Type of histological stain used (options: "H&E", "LFB", "IHC")'
    default: H&E
implementation:
  type: module_ref
  module: biomni.tool.immunology
  function: analyze_cns_lesion_histology
returns:
  type: str
  description: 工具执行结果
