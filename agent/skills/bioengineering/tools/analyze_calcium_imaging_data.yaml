name: analyze_calcium_imaging_data
display_name: Analyze Calcium Imaging Data
description: Analyze calcium imaging data to quantify neuronal activity metrics including
  cell counts, event rates, decay times, and signal-to-noise ratios.
parameters:
  required:
  - name: image_stack_path
    type: str
    description: Path to the time-series stack of fluorescence microscopy images (TIFF
      format)
  optional:
  - name: output_dir
    type: str
    description: Directory to save output files
    default: ./
implementation:
  type: module_ref
  module: biomni.tool.bioengineering
  function: analyze_calcium_imaging_data
returns:
  type: str
  description: 工具执行结果
