name: predict_o_glycosylation_hotspots
display_name: Predict O Glycosylation Hotspots
description: Heuristic O-glycosite hotspot prediction using local S/T density (lightweight
  baseline; see NetOGlyc 4.0 for SOTA).
parameters:
  required:
  - name: sequence
    type: str
    description: Protein sequence (one-letter AA codes)
  optional:
  - name: window
    type: int
    description: Odd-sized window for local density (>=3)
    default: 7
  - name: min_st_fraction
    type: float
    description: Min S/T fraction in window to flag site
    default: 0.4
  - name: disallow_proline_next
    type: bool
    description: Avoid S/T immediately followed by Proline
    default: true
implementation:
  type: module_ref
  module: biomni.tool.glycoengineering
  function: predict_o_glycosylation_hotspots
returns:
  type: str
  description: 工具执行结果
