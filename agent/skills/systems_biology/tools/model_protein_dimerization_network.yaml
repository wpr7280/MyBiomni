name: model_protein_dimerization_network
display_name: Model Protein Dimerization Network
description: Model protein dimerization networks to find equilibrium concentrations
  of dimers.
parameters:
  required:
  - name: monomer_concentrations
    type: dict
    description: Dictionary mapping monomer names to their initial concentrations
      (in arbitrary units)
  - name: dimerization_affinities
    type: dict
    description: Dictionary mapping dimer names (as 'A-B' strings) to their association
      constants (Ka)
  - name: network_topology
    type: list
    description: List of (monomer1, monomer2) pairs that can form dimers
implementation:
  type: module_ref
  module: biomni.tool.systems_biology
  function: model_protein_dimerization_network
returns:
  type: str
  description: 工具执行结果
