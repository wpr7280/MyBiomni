name: simulate_protein_signaling_network
display_name: Simulate Protein Signaling Network
description: Simulate protein signaling network dynamics using ODE-based logic modeling
  with normalized Hill functions.
parameters:
  required:
  - name: network_structure
    type: dict
    description: Dictionary defining the network topology. Each key is a target protein
      and its value is a list of tuples (regulator, regulation_type) where regulation_type
      is 1 for activation and -1 for inhibition.
  - name: reaction_params
    type: dict
    description: Dictionary of reaction parameters. Keys are tuples (regulator, target)
      and values are dictionaries with keys 'W' (weight), 'n' (Hill coefficient),
      and 'EC50' (half-maximal effective concentration).
  - name: species_params
    type: dict
    description: Dictionary of species parameters. Keys are protein names and values
      are dictionaries with keys 'tau' (time constant), 'y0' (initial concentration),
      and 'ymax' (maximum concentration).
  optional:
  - name: simulation_time
    type: float
    description: Total simulation time in arbitrary time units.
    default: 100
  - name: time_points
    type: int
    description: Number of time points for the simulation.
    default: 1000
implementation:
  type: module_ref
  module: biomni.tool.systems_biology
  function: simulate_protein_signaling_network
returns:
  type: str
  description: 工具执行结果
