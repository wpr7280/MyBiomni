name: check_fda_drug_recalls
display_name: Check Fda Drug Recalls
description: Check for FDA drug recalls and enforcement actions from the OpenFDA database
  to identify safety concerns and regulatory actions.
parameters:
  required:
  - name: drug_name
    type: str
    description: Name of the drug to check for recalls
  optional:
  - name: classification
    type: List[str]
    description: Optional filter by recall class ['Class I', 'Class II', 'Class III']
    default: null
  - name: date_range
    type: Tuple[str, str]
    description: Optional date range for recalls as (start_date, end_date)
    default: null
implementation:
  type: module_ref
  module: biomni.tool.pharmacology
  function: check_fda_drug_recalls
returns:
  type: str
  description: 工具执行结果
