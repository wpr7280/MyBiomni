name: query_openfda
display_name: Query Openfda
description: Query the OpenFDA API using natural language or direct parameters.
parameters:
  required:
  - name: prompt
    type: str
    description: Natural language query about OpenFDA data
  optional:
  - name: endpoint
    type: str
    description: Direct endpoint or full URL
    default: null
  - name: max_results
    type: int
    description: Max results (limit)
    default: 100
  - name: verbose
    type: bool
    description: Return detailed results
    default: true
  - name: search_params
    type: dict
    description: Search parameters mapping
    default: null
  - name: sort_params
    type: dict
    description: Sort parameters mapping
    default: null
  - name: count_params
    type: str
    description: Field to count
    default: null
  - name: skip_results
    type: int
    description: Skip for pagination
    default: 0
implementation:
  type: module_ref
  module: biomni.tool.database
  function: query_openfda
returns:
  type: str
  description: 工具执行结果
