name: query_gwas_catalog
display_name: Query Gwas Catalog
description: Query the GWAS Catalog API using natural language or a direct endpoint.
parameters:
  required:
  - name: prompt
    type: str
    description: Natural language query about GWAS data
  optional:
  - name: endpoint
    type: str
    description: Endpoint name (e.g., 'studies')
    default: null
  - name: max_results
    type: int
    description: Max results per page (size)
    default: 3
implementation:
  type: module_ref
  module: biomni.tool.database
  function: query_gwas_catalog
returns:
  type: str
  description: 工具执行结果
