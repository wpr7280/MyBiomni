name: query_emdb
display_name: Query Emdb
description: Query the Electron Microscopy Data Bank (EMDB) using natural language
  or a direct endpoint.
parameters:
  required:
  - name: prompt
    type: str
    description: Natural language query about EM structures
  optional:
  - name: endpoint
    type: str
    description: Full API endpoint to query
    default: null
  - name: verbose
    type: bool
    description: Return detailed results
    default: true
implementation:
  type: module_ref
  module: biomni.tool.database
  function: query_emdb
returns:
  type: str
  description: 工具执行结果
