name: query_kegg
display_name: Query Kegg
description: Take a natural language prompt and convert it to a structured KEGG API
  query.
parameters:
  required:
  - name: prompt
    type: str
    description: Natural language query about KEGG data
  optional:
  - name: endpoint
    type: str
    description: Direct KEGG endpoint to query
    default: null
  - name: verbose
    type: bool
    description: Return detailed results
    default: true
implementation:
  type: module_ref
  module: biomni.tool.database
  function: query_kegg
returns:
  type: str
  description: 工具执行结果
