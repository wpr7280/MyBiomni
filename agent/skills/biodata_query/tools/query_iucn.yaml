name: query_iucn
display_name: Query Iucn
description: Query the IUCN Red List API using natural language or a direct endpoint.
parameters:
  required:
  - name: token
    type: str
    description: IUCN API token
  optional:
  - name: prompt
    type: str
    description: Natural language query about species conservation status
    default: null
  - name: endpoint
    type: str
    description: Endpoint name or full URL
    default: null
  - name: verbose
    type: bool
    description: Return detailed results
    default: true
implementation:
  type: module_ref
  module: biomni.tool.database
  function: query_iucn
returns:
  type: str
  description: 工具执行结果
