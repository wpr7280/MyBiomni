name: query_encode
display_name: Query Encode
description: Query the ENCODE Portal API to locate functional genomics data (experiments,
  files, biosamples, datasets).
parameters:
  required:
  - name: prompt
    type: str
    description: Natural language query about functional genomics data
  optional:
  - name: endpoint
    type: str
    description: Direct ENCODE Portal endpoint or full URL
    default: null
  - name: max_results
    type: int|str
    description: Limit for search endpoints (number or 'all')
    default: 25
  - name: verbose
    type: bool
    description: Return detailed results
    default: true
implementation:
  type: module_ref
  module: biomni.tool.database
  function: query_encode
returns:
  type: str
  description: 工具执行结果
