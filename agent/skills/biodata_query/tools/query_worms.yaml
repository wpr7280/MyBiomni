name: query_worms
display_name: Query Worms
description: Query the World Register of Marine Species (WoRMS) REST API using natural
  language or a direct endpoint.
parameters:
  required:
  - name: prompt
    type: str
    description: Natural language query about marine species
  optional:
  - name: endpoint
    type: str
    description: Full URL or endpoint specification
    default: null
  - name: verbose
    type: bool
    description: Return detailed results
    default: true
implementation:
  type: module_ref
  module: biomni.tool.database
  function: query_worms
returns:
  type: str
  description: 工具执行结果
