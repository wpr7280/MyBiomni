name: query_paleobiology
display_name: Query Paleobiology
description: Query the Paleobiology Database (PBDB) API using natural language or
  a direct endpoint.
parameters:
  required:
  - name: prompt
    type: str
    description: Natural language query about fossil records
  optional:
  - name: endpoint
    type: str
    description: API endpoint name or full URL
    default: null
  - name: verbose
    type: bool
    description: Return detailed results
    default: true
implementation:
  type: module_ref
  module: biomni.tool.database
  function: query_paleobiology
returns:
  type: str
  description: 工具执行结果
