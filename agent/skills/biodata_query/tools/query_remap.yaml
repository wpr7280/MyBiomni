name: query_remap
display_name: Query Remap
description: Query the ReMap database for regulatory elements and transcription factor
  binding.
parameters:
  required:
  - name: prompt
    type: str
    description: Natural language query about TF binding sites
  optional:
  - name: endpoint
    type: str
    description: Full API endpoint to query
    default: null
  - name: verbose
    type: bool
    description: Return detailed results
    default: true
implementation:
  type: module_ref
  module: biomni.tool.database
  function: query_remap
returns:
  type: str
  description: 工具执行结果
