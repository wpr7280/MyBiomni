name: quick_deformable_registration
display_name: Quick Deformable Registration
description: Perform deformable (B-spline) image registration between two medical
  images using SimpleITK. Deformable registration allows for local non-linear transformations,
  handling complex deformations. Most flexible but computationally intensive registration
  method.
parameters:
  required:
  - name: fixed_image_path
    type: str
    description: Path to the reference (fixed) image file (supports .nii, .nii.gz,
      .nrrd, .mha, .mhd formats)
  - name: moving_image_path
    type: str
    description: Path to the image to be registered (moving image)
  - name: output_dir
    type: str
    description: Directory path to save registration results and outputs
  optional:
  - name: metric
    type: str
    description: 'Similarity metric for registration: ''mutual_information'', ''mean_squares'',
      ''correlation'', or ''normalized_correlation'''
    default: mutual_information
  - name: optimizer
    type: str
    description: 'Optimization method: ''gradient_descent'', ''lbfgsb'', ''powell'',
      or ''amoeba'''
    default: gradient_descent
  - name: preprocess
    type: bool
    description: Whether to preprocess images (denoising and normalization)
    default: true
  - name: create_visualizations
    type: bool
    description: Whether to create visualization plots
    default: true
  - name: learning_rate
    type: float
    description: Learning rate for gradient descent optimizer
    default: 0.01
  - name: number_of_iterations
    type: int
    description: Maximum number of optimization iterations
    default: 100
  - name: gradient_convergence_tolerance
    type: float
    description: Convergence tolerance for optimization
    default: 1.0e-06
  - name: number_of_control_points
    type: int
    description: Number of B-spline control points per dimension for deformable registration
    default: 4
implementation:
  type: module_ref
  module: biomni.tool.bioimaging
  function: quick_deformable_registration
returns:
  type: str
  description: 工具执行结果
