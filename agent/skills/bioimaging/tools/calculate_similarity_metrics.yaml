  - name: image1_path
    type: str
    description: Path to the first image file
  - name: image2_path
    type: str
    description: Path to the second image file
implementation:
  type: module_ref
  module: biomni.tool.bioimaging
  function: calculate_similarity_metrics
returns:
  type: str
  description: 工具执行结果
